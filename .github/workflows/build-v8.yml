name: Build Samsung Stand v8

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/geometry_model.py"
      - "scripts/v2_params.py"
      - "scripts/v3_params.py"
      - "scripts/v8_params.py"
      - "scripts/v8_geometry.py"
      - "scripts/validate_v8_design.py"
      - "scripts/build_v8.py"
      - "scripts/validate_meshes_v8.py"
      - "scripts/validate_v8_assembly.py"
      - "scripts/preview_v8.scad"
      - "cad/v7/STEP/**"
      - ".github/workflows/build-v8.yml"

concurrency:
  group: samsung-stand-v8-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-v8:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v6

      - name: Validate v8 design
        run: |
          set -euo pipefail
          python3 scripts/validate_v8_design.py > v8-design-validation.json
          python3 -m unittest discover -s tests -v

      - name: Verify validated v7 upstream exists
        run: |
          set -euo pipefail
          test -s cad/v7/STEP/samsung_stand_v7_base_center.step
          test -s cad/v7/STEP/samsung_stand_v7_rotor.step
          test -s cad/v7/validation/MESH_VALIDATION_v7.json
          test -s cad/v7/validation/ASSEMBLY_VALIDATION_v7.json
          python3 - <<'PY'
          import json
          for p in (
              'cad/v7/validation/MESH_VALIDATION_v7.json',
              'cad/v7/validation/ASSEMBLY_VALIDATION_v7.json',
          ):
              d=json.load(open(p,encoding='utf-8'))
              assert not d.get('failed'),(p,d.get('failed'))
          print('Validated v7 upstream is green')
          PY

      - name: Install runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openscad libfuse2 xvfb python3-venv
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install numpy trimesh

      - name: Cache FreeCAD AppImage
        id: freecad-cache
        uses: actions/cache@v5
        with:
          path: FreeCAD.AppImage
          key: freecad-1.1.3-linux-x86_64-py311

      - name: Download verified FreeCAD 1.1.3
        if: steps.freecad-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o FreeCAD.AppImage \
            https://github.com/FreeCAD/FreeCAD/releases/download/1.1.3/FreeCAD_1.1.3-Linux-x86_64-py311.AppImage

      - name: Verify and extract FreeCAD
        run: |
          set -euo pipefail
          echo "3a853eb69ee595f779f2255dbf80a765926981d8ff68903cefee4dfb03a8f5ef  FreeCAD.AppImage" | sha256sum -c -
          chmod +x FreeCAD.AppImage
          rm -rf squashfs-root
          ./FreeCAD.AppImage --appimage-extract >/dev/null
          FREECADCMD=$(find squashfs-root -type f \( -name FreeCADCmd -o -name freecadcmd \) | head -n1)
          test -n "$FREECADCMD"
          echo "FREECADCMD=$FREECADCMD" >> "$GITHUB_ENV"
          "$FREECADCMD" -c 'import FreeCAD,Part,Import,Mesh,MeshPart; print(FreeCAD.Version()); assert Part.makeBox(1,1,1).isValid()'

      - name: Compile v8 scripts
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/v8_params.py \
            scripts/v8_geometry.py \
            scripts/validate_v8_design.py \
            scripts/build_v8.py \
            scripts/validate_meshes_v8.py \
            scripts/validate_v8_assembly.py

      - name: Build v8 CAD
        run: |
          set -euo pipefail
          "$FREECADCMD" -c "import sys; sys.path.insert(0,'scripts'); import build_v8" \
            2>&1 | tee build_v8.log
          test -s build_v8/VALIDATION_v8_source.json

      - name: Validate v8 meshes
        run: |
          set -euo pipefail
          .venv/bin/python scripts/validate_meshes_v8.py
          test -s build_v8/MESH_VALIDATION_v8.json

      - name: Validate installed v8 OCC assembly
        run: |
          set -euo pipefail
          "$FREECADCMD" -c "import sys; sys.path.insert(0,'scripts'); import validate_v8_assembly as V; V.main()"
          test -s build_v8/ASSEMBLY_VALIDATION_v8.json

      - name: Render installed v8 preview
        run: |
          set -euo pipefail
          xvfb-run -a openscad \
            --imgsize=1600,1000 \
            --projection=ortho \
            --viewall \
            --autocenter \
            --camera=0,0,0,62,0,28,820 \
            -o build_v8/samsung_stand_v8_preview.png \
            scripts/preview_v8.scad
          test -s build_v8/samsung_stand_v8_preview.png

      - name: Publish validated v8 outputs
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p cad/v8/FCStd cad/v8/STEP cad/v8/STL cad/v8/assembly cad/v8/validation

          rm -f cad/v8/FCStd/samsung_stand_v8_*.FCStd
          rm -f cad/v8/STEP/samsung_stand_v8_*.step
          rm -f cad/v8/STL/samsung_stand_v8_*.stl

          cp build_v8/samsung_stand_v8_*.FCStd cad/v8/FCStd/
          cp build_v8/samsung_stand_v8_*.step cad/v8/STEP/
          cp build_v8/samsung_stand_v8_*.stl cad/v8/STL/
          cp build_v8/samsung_stand_v8_preview.png cad/v8/assembly/
          cp build_v8/VALIDATION_v8_source.json cad/v8/validation/
          cp build_v8/MESH_VALIDATION_v8.json cad/v8/validation/
          cp build_v8/ASSEMBLY_VALIDATION_v8.json cad/v8/validation/
          cp v8-design-validation.json cad/v8/validation/DESIGN_VALIDATION_v8.json

          cat > cad/v8/README.md <<'EOF'
          # Samsung Stand v8

          v8 replaces the previously unproven retainer concepts with explicitly assembled and OCC-validated PETG retention.

          Changes:
          - 4 horizontal snap pins lock BASE_LEFT/RIGHT to BASE_CENTER entirely above the Sounddeck plane;
          - 2 compact snap pins lock ROTOR to the two INNER_ARM parts;
          - 2 longer snap pins pass completely through the INNER_ARM saddle region and lock the OUTER_GUIDE parts from an externally accessible side;
          - the fixed pivot post is extended and cross-drilled with a support-free roof tunnel;
          - 1 pivot cross-pin sits inside a circular rotor counterbore and positively limits axial lift while preserving rotation.

          Removed from the v8 print list:
          - legacy vertical base retainers;
          - legacy pivot C-clip;
          - legacy v2 arm lock pin.

          The v7 replaceable wear surfaces and v5 detent/end-stop architecture remain upstream.

          Geometry validation is not physical structural release. Fit/proof/cycling gates in docs/PHYSICAL_RELEASE_GATES.md still apply.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cad/v8
          if git diff --cached --quiet; then
            echo "Validated v8 outputs already current"
          else
            git commit -m "Publish validated Samsung Stand v8 CAD"
            pushed=false
            for attempt in 1 2 3 4; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              echo "Concurrent main update during publish; retrying ($attempt/4)"
              sleep 2
            done
            test "$pushed" = true
          fi

      - name: Upload complete v8 proof
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: samsung-stand-v8-complete
          path: |
            build_v8/
            build_v8.log
            v8-design-validation.json
