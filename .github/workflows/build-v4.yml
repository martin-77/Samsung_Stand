name: Build Samsung Stand v4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/geometry_model.py"
      - "scripts/v2_params.py"
      - "scripts/v3_params.py"
      - "scripts/v4_params.py"
      - "scripts/v4_geometry.py"
      - "scripts/validate_v4_design.py"
      - "scripts/build_v4.py"
      - "scripts/validate_meshes_v4.py"
      - "scripts/validate_v4_assembly.py"
      - "scripts/preview_v4.scad"
      - "cad/v3/STEP/**"
      - ".github/workflows/build-v4.yml"

concurrency:
  group: samsung-stand-v4-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-v4:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v6

      - name: Validate geometry chain through v4
        run: |
          set -euo pipefail
          python3 scripts/validate_layout.py > layout-validation.json
          python3 scripts/validate_v1_design.py > v1-design-validation.json
          python3 scripts/validate_v2_design.py > v2-design-validation.json
          python3 scripts/validate_v3_design.py > v3-design-validation.json
          python3 scripts/validate_v4_design.py > v4-design-validation.json
          python3 -m unittest discover -s tests -v

      - name: Verify validated v3 upstream exists
        run: |
          set -euo pipefail
          test -s cad/v3/STEP/samsung_stand_v3_base_center.step
          test -s cad/v3/STEP/samsung_stand_v3_rotor.step
          test -s cad/v3/STEP/samsung_stand_v3_outer_guide.step
          test -s cad/v3/validation/MESH_VALIDATION_v3.json
          test -s cad/v3/validation/ASSEMBLY_VALIDATION_v3.json
          python3 - <<'PY'
          import json
          for p in (
              'cad/v3/validation/MESH_VALIDATION_v3.json',
              'cad/v3/validation/ASSEMBLY_VALIDATION_v3.json',
          ):
              d=json.load(open(p, encoding='utf-8'))
              assert not d.get('failed'), (p,d.get('failed'))
          print('Validated v3 upstream is green')
          PY

      - name: Install runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openscad libfuse2 xvfb python3-venv
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install numpy trimesh

      - name: Cache FreeCAD AppImage
        id: freecad-cache
        uses: actions/cache@v5
        with:
          path: FreeCAD.AppImage
          key: freecad-1.1.3-linux-x86_64-py311

      - name: Download verified FreeCAD 1.1.3
        if: steps.freecad-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o FreeCAD.AppImage \
            https://github.com/FreeCAD/FreeCAD/releases/download/1.1.3/FreeCAD_1.1.3-Linux-x86_64-py311.AppImage

      - name: Verify and extract FreeCAD
        run: |
          set -euo pipefail
          echo "3a853eb69ee595f779f2255dbf80a765926981d8ff68903cefee4dfb03a8f5ef  FreeCAD.AppImage" | sha256sum -c -
          chmod +x FreeCAD.AppImage
          rm -rf squashfs-root
          ./FreeCAD.AppImage --appimage-extract >/dev/null
          FREECADCMD=$(find squashfs-root -type f \( -name FreeCADCmd -o -name freecadcmd \) | head -n1)
          test -n "$FREECADCMD"
          echo "FREECADCMD=$FREECADCMD" >> "$GITHUB_ENV"
          "$FREECADCMD" -c 'import FreeCAD,Part,Import,Mesh,MeshPart; print(FreeCAD.Version()); assert Part.makeBox(1,1,1).isValid()'

      - name: Compile v4 scripts
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/geometry_model.py \
            scripts/v2_params.py \
            scripts/v3_params.py \
            scripts/v4_params.py \
            scripts/v4_geometry.py \
            scripts/validate_v4_design.py \
            scripts/build_v4.py \
            scripts/validate_meshes_v4.py \
            scripts/validate_v4_assembly.py

      - name: Build v4 CAD
        run: |
          set -euo pipefail
          "$FREECADCMD" -c "import sys; sys.path.insert(0, 'scripts'); import build_v4" 2>&1 | tee build_v4.log
          test -s build_v4/VALIDATION_v4_source.json
          test -s build_v4/samsung_stand_v4_base_center.stl
          test -s build_v4/samsung_stand_v4_rotor.stl
          test -s build_v4/samsung_stand_v4_outer_guide.stl

      - name: Validate v4 meshes
        run: |
          set -euo pipefail
          .venv/bin/python scripts/validate_meshes_v4.py
          test -s build_v4/MESH_VALIDATION_v4.json

      - name: Validate installed v4 OCC assembly
        run: |
          set -euo pipefail
          "$FREECADCMD" -c "import sys; sys.path.insert(0, 'scripts'); import validate_v4_assembly as V; V.main()"
          test -s build_v4/ASSEMBLY_VALIDATION_v4.json

      - name: Render installed v4 preview
        run: |
          set -euo pipefail
          xvfb-run -a openscad \
            --imgsize=1600,1000 \
            --projection=ortho \
            --viewall \
            --autocenter \
            --camera=0,0,0,62,0,28,850 \
            -o build_v4/samsung_stand_v4_preview.png \
            scripts/preview_v4.scad
          test -s build_v4/samsung_stand_v4_preview.png

      - name: Publish validated v4 outputs
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p cad/v4/FCStd cad/v4/STEP cad/v4/STL cad/v4/assembly cad/v4/validation

          rm -f cad/v4/FCStd/samsung_stand_v4_*.FCStd
          rm -f cad/v4/STEP/samsung_stand_v4_*.step
          rm -f cad/v4/STL/samsung_stand_v4_*.stl

          cp build_v4/samsung_stand_v4_*.FCStd cad/v4/FCStd/
          cp build_v4/samsung_stand_v4_*.step cad/v4/STEP/
          cp build_v4/samsung_stand_v4_*.stl cad/v4/STL/
          cp build_v4/samsung_stand_v4_preview.png cad/v4/assembly/
          cp build_v4/VALIDATION_v4_source.json cad/v4/validation/
          cp build_v4/MESH_VALIDATION_v4.json cad/v4/validation/
          cp build_v4/ASSEMBLY_VALIDATION_v4.json cad/v4/validation/
          cp v4-design-validation.json cad/v4/validation/DESIGN_VALIDATION_v4.json

          cat > cad/v4/README.md <<'EOF'
          # Samsung Stand v4

          v4 extends the validated v3 assembly with positive mechanical +/-15 degree swivel end stops.

          Stop architecture:
          - a flat-printable spoke and broad stop tab are fused into the rotor;
          - two broad fixed stop towers are fused into BASE_CENTER;
          - BASE_CENTER has a narrow sweep-clearance corridor above the bearing plane so the stop can start at rotor-local Z=0 without support;
          - the mechanical stop carries end-stop load. A later detent, if added, is positional only.

          Validation contract:
          - at +/-14 degrees the stop must remain free;
          - at +/-15 degrees the stop must be surface contact without meaningful penetration;
          - at +/-15.5 degrees the stop must show solid interference, proving positive blocking;
          - the full rotating carrier is collision-checked against the fixed base through representative sweep positions.

          The Samsung arm contact channel remains a measured-fit TODO; v4 does not change the v3 placeholder fit claim.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cad/v4
          if git diff --cached --quiet; then
            echo "Validated v4 outputs already current"
          else
            git commit -m "Publish validated Samsung Stand v4 CAD"
            pushed=false
            for attempt in 1 2 3 4; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              echo "Concurrent main update during publish; retrying ($attempt/4)"
              sleep 2
            done
            test "$pushed" = true
          fi

      - name: Upload complete v4 proof
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: samsung-stand-v4-complete
          path: |
            build_v4/
            build_v4.log
            layout-validation.json
            v1-design-validation.json
            v2-design-validation.json
            v3-design-validation.json
            v4-design-validation.json
