name: Build Fit Coupons

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/geometry_model.py"
      - "scripts/v2_params.py"
      - "scripts/v3_params.py"
      - "scripts/fit_coupon_params.py"
      - "scripts/build_fit_coupons.py"
      - "scripts/validate_fit_coupons.py"
      - "scripts/validate_fit_coupon_meshes.py"
      - ".github/workflows/build-fit-coupons.yml"

concurrency:
  group: samsung-stand-fit-coupons-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-fit-coupons:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - name: Validate coupon source geometry
        run: |
          set -euo pipefail
          python3 scripts/validate_fit_coupons.py > fit-coupon-design-validation.json

      - name: Install runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libfuse2 python3-venv
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install numpy trimesh

      - name: Cache FreeCAD AppImage
        id: freecad-cache
        uses: actions/cache@v5
        with:
          path: FreeCAD.AppImage
          key: freecad-1.1.3-linux-x86_64-py311

      - name: Download verified FreeCAD 1.1.3
        if: steps.freecad-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o FreeCAD.AppImage \
            https://github.com/FreeCAD/FreeCAD/releases/download/1.1.3/FreeCAD_1.1.3-Linux-x86_64-py311.AppImage

      - name: Verify and extract FreeCAD
        run: |
          set -euo pipefail
          echo "3a853eb69ee595f779f2255dbf80a765926981d8ff68903cefee4dfb03a8f5ef  FreeCAD.AppImage" | sha256sum -c -
          chmod +x FreeCAD.AppImage
          rm -rf squashfs-root
          ./FreeCAD.AppImage --appimage-extract >/dev/null
          FREECADCMD=$(find squashfs-root -type f \( -name FreeCADCmd -o -name freecadcmd \) | head -n1)
          test -n "$FREECADCMD"
          echo "FREECADCMD=$FREECADCMD" >> "$GITHUB_ENV"

      - name: Compile coupon scripts
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/fit_coupon_params.py \
            scripts/build_fit_coupons.py \
            scripts/validate_fit_coupons.py \
            scripts/validate_fit_coupon_meshes.py

      - name: Build coupons
        run: |
          set -euo pipefail
          "$FREECADCMD" -c "import sys; sys.path.insert(0, 'scripts'); import build_fit_coupons" 2>&1 | tee build_fit_coupons.log
          test -s build_fit_coupons/FIT_COUPON_REPORT.json

      - name: Validate coupon meshes
        run: |
          set -euo pipefail
          .venv/bin/python scripts/validate_fit_coupon_meshes.py
          test -s build_fit_coupons/FIT_COUPON_MESH_VALIDATION.json

      - name: Publish fit coupons
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p cad/fit_coupons/FCStd cad/fit_coupons/STEP cad/fit_coupons/STL cad/fit_coupons/validation

          rm -f cad/fit_coupons/FCStd/fit_*.FCStd
          rm -f cad/fit_coupons/STEP/fit_*.step
          rm -f cad/fit_coupons/STL/fit_*.stl

          cp build_fit_coupons/fit_*.FCStd cad/fit_coupons/FCStd/
          cp build_fit_coupons/fit_*.step cad/fit_coupons/STEP/
          cp build_fit_coupons/fit_*.stl cad/fit_coupons/STL/
          cp build_fit_coupons/FIT_COUPON_REPORT.json cad/fit_coupons/validation/
          cp build_fit_coupons/FIT_COUPON_MESH_VALIDATION.json cad/fit_coupons/validation/
          cp fit-coupon-design-validation.json cad/fit_coupons/validation/FIT_COUPON_DESIGN_VALIDATION.json

          cat > cad/fit_coupons/README.md <<'EOF'
          # Structural fit coupons

          These small coupons calibrate the three form-locking roof-key joints before large PETG parts are printed.

          Families:
          - base: BASE_LEFT/RIGHT into BASE_CENTER;
          - inner: INNER_ARM into ROTOR;
          - outer: OUTER_GUIDE into INNER_ARM.

          For each family print:
          - one male probe;
          - c030 receiver: 0.30 mm nominal clearance;
          - c040 receiver: 0.40 mm nominal clearance;
          - c050 receiver: 0.50 mm nominal clearance.

          The current production CAD uses 0.40 mm nominal side/roof clearance.

          Selection rule:
          use the smallest receiver that slides fully onto the probe without force, binding or visible PETG whitening, while still avoiding obvious rocking.

          These coupons test cross-sectional printer/material fit. They do not replace the later full-joint or proof-load test.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cad/fit_coupons
          if git diff --cached --quiet; then
            echo "Fit coupons already current"
          else
            git commit -m "Publish structural fit coupons"
            git pull --rebase origin main
            git push
          fi

      - name: Upload coupon proof
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: samsung-stand-fit-coupons
          path: |
            build_fit_coupons/
            build_fit_coupons.log
            fit-coupon-design-validation.json
