name: Build Samsung Stand v5

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/geometry_model.py"
      - "scripts/v2_params.py"
      - "scripts/v3_params.py"
      - "scripts/v4_params.py"
      - "scripts/v5_params.py"
      - "scripts/v5_geometry.py"
      - "scripts/validate_v5_design.py"
      - "scripts/build_v5.py"
      - "scripts/validate_meshes_v5.py"
      - "scripts/validate_v5_assembly.py"
      - "scripts/preview_v5.scad"
      - "cad/v4/STEP/**"
      - ".github/workflows/build-v5.yml"

concurrency:
  group: samsung-stand-v5-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-v5:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v6

      - name: Validate geometry chain through v5
        run: |
          set -euo pipefail
          python3 scripts/validate_layout.py > layout-validation.json
          python3 scripts/validate_v1_design.py > v1-design-validation.json
          python3 scripts/validate_v2_design.py > v2-design-validation.json
          python3 scripts/validate_v3_design.py > v3-design-validation.json
          python3 scripts/validate_v4_design.py > v4-design-validation.json
          python3 scripts/validate_v5_design.py > v5-design-validation.json
          python3 -m unittest discover -s tests -v

      - name: Verify validated v4 upstream exists
        run: |
          set -euo pipefail
          test -s cad/v4/STEP/samsung_stand_v4_base_center.step
          test -s cad/v4/STEP/samsung_stand_v4_rotor.step
          test -s cad/v4/validation/MESH_VALIDATION_v4.json
          test -s cad/v4/validation/ASSEMBLY_VALIDATION_v4.json
          python3 - <<'PY'
          import json
          for p in (
              'cad/v4/validation/MESH_VALIDATION_v4.json',
              'cad/v4/validation/ASSEMBLY_VALIDATION_v4.json',
          ):
              d=json.load(open(p, encoding='utf-8'))
              assert not d.get('failed'), (p,d.get('failed'))
          print('Validated v4 upstream is green')
          PY

      - name: Install runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openscad libfuse2 xvfb python3-venv
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install numpy trimesh

      - name: Cache FreeCAD AppImage
        id: freecad-cache
        uses: actions/cache@v5
        with:
          path: FreeCAD.AppImage
          key: freecad-1.1.3-linux-x86_64-py311

      - name: Download verified FreeCAD 1.1.3
        if: steps.freecad-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o FreeCAD.AppImage \
            https://github.com/FreeCAD/FreeCAD/releases/download/1.1.3/FreeCAD_1.1.3-Linux-x86_64-py311.AppImage

      - name: Verify and extract FreeCAD
        run: |
          set -euo pipefail
          echo "3a853eb69ee595f779f2255dbf80a765926981d8ff68903cefee4dfb03a8f5ef  FreeCAD.AppImage" | sha256sum -c -
          chmod +x FreeCAD.AppImage
          rm -rf squashfs-root
          ./FreeCAD.AppImage --appimage-extract >/dev/null
          FREECADCMD=$(find squashfs-root -type f \( -name FreeCADCmd -o -name freecadcmd \) | head -n1)
          test -n "$FREECADCMD"
          echo "FREECADCMD=$FREECADCMD" >> "$GITHUB_ENV"
          "$FREECADCMD" -c 'import FreeCAD,Part,Import,Mesh,MeshPart; print(FreeCAD.Version()); assert Part.makeBox(1,1,1).isValid()'

      - name: Compile v5 scripts
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/geometry_model.py \
            scripts/v2_params.py \
            scripts/v3_params.py \
            scripts/v4_params.py \
            scripts/v5_params.py \
            scripts/v5_geometry.py \
            scripts/validate_v5_design.py \
            scripts/build_v5.py \
            scripts/validate_meshes_v5.py \
            scripts/validate_v5_assembly.py

      - name: Build v5 CAD
        run: |
          set -euo pipefail
          "$FREECADCMD" -c "import sys; sys.path.insert(0, 'scripts'); import build_v5" 2>&1 | tee build_v5.log
          test -s build_v5/VALIDATION_v5_source.json
          test -s build_v5/samsung_stand_v5_base_center.stl
          test -s build_v5/samsung_stand_v5_rotor.stl
          test -s build_v5/samsung_stand_v5_detent_cassette_t18.stl
          test -s build_v5/samsung_stand_v5_detent_cassette_t22.stl
          test -s build_v5/samsung_stand_v5_detent_cassette_t26.stl
          test -s build_v5/samsung_stand_v5_detent_pin.stl

      - name: Validate v5 meshes
        run: |
          set -euo pipefail
          .venv/bin/python scripts/validate_meshes_v5.py
          test -s build_v5/MESH_VALIDATION_v5.json

      - name: Validate installed v5 OCC assembly
        run: |
          set -euo pipefail
          "$FREECADCMD" -c "import sys; sys.path.insert(0, 'scripts'); import validate_v5_assembly as V; V.main()"
          test -s build_v5/ASSEMBLY_VALIDATION_v5.json

      - name: Render installed v5 preview
        run: |
          set -euo pipefail
          xvfb-run -a openscad \
            --imgsize=1600,1000 \
            --projection=ortho \
            --viewall \
            --autocenter \
            --camera=0,0,0,62,0,28,850 \
            -o build_v5/samsung_stand_v5_preview.png \
            scripts/preview_v5.scad
          test -s build_v5/samsung_stand_v5_preview.png

      - name: Publish validated v5 outputs
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p cad/v5/FCStd cad/v5/STEP cad/v5/STL cad/v5/assembly cad/v5/validation

          rm -f cad/v5/FCStd/samsung_stand_v5_*.FCStd
          rm -f cad/v5/STEP/samsung_stand_v5_*.step
          rm -f cad/v5/STL/samsung_stand_v5_*.stl

          cp build_v5/samsung_stand_v5_*.FCStd cad/v5/FCStd/
          cp build_v5/samsung_stand_v5_*.step cad/v5/STEP/
          cp build_v5/samsung_stand_v5_*.stl cad/v5/STL/
          cp build_v5/samsung_stand_v5_preview.png cad/v5/assembly/
          cp build_v5/VALIDATION_v5_source.json cad/v5/validation/
          cp build_v5/MESH_VALIDATION_v5.json cad/v5/validation/
          cp build_v5/ASSEMBLY_VALIDATION_v5.json cad/v5/validation/
          cp v5-design-validation.json cad/v5/validation/DESIGN_VALIDATION_v5.json

          cat > cad/v5/README.md <<'EOF'
          # Samsung Stand v5

          v5 adds a replaceable zero-position detent calibration cassette to the validated v4 structure.

          Architecture:
          - only 0 degrees is detented;
          - +/-15 degrees remain positive structural end stops from v4;
          - the rotor carries a flat cam sector with a shallow V-notch at zero;
          - a fixed, replaceable PETG cantilever cassette engages that track;
          - the cassette is printed flat so the spring bends in the XY plane;
          - two removable locating pins retain the cassette on a fixed platform.

          Calibration variants:
          - t18: 1.8 mm spring thickness;
          - t22: 2.2 mm spring thickness;
          - t26: 2.6 mm spring thickness.

          The beam strain estimates are geometric only. The documented force ranges use a broad nominal PETG modulus range and are not treated as measured print behavior. Print one calibration variant first before choosing the final detent feel.

          v5 re-validates the v4 mechanical end stops after adding the cam and fixed mount.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cad/v5
          if git diff --cached --quiet; then
            echo "Validated v5 outputs already current"
          else
            git commit -m "Publish validated Samsung Stand v5 CAD"
            git pull --rebase origin main
            git push
          fi

      - name: Upload complete v5 proof
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: samsung-stand-v5-complete
          path: |
            build_v5/
            build_v5.log
            layout-validation.json
            v1-design-validation.json
            v2-design-validation.json
            v3-design-validation.json
            v4-design-validation.json
            v5-design-validation.json
